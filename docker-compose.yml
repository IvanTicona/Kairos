services:
  forge:
    build:
      context: ./services/forge
      dockerfile: Dockerfile
    container_name: kairos-forge
    restart: unless-stopped
    ports:
      - "${FORGE_PORT:-3001}:3001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FORGE_API_KEY=${FORGE_API_KEY}
      - FORGE_PORT=3001
      - FORGE_TIER_MAP=${FORGE_TIER_MAP:-}
    volumes:
      - forge-data:/app/data
    networks:
      - kairos

  chronos:
    build:
      context: ./services/chronos
      dockerfile: Dockerfile
    container_name: kairos-chronos
    restart: unless-stopped
    ports:
      - "${CHRONOS_PORT:-3002}:3002"
    environment:
      - CHRONOS_PORT=3002
      - CHRONOS_DB_PATH=data/chronos.db
    volumes:
      - chronos-data:/app/data
    networks:
      - kairos

  bot:
    build:
      context: ./services/bot
      dockerfile: Dockerfile
    container_name: kairos-bot
    restart: unless-stopped
    expose:
      - "3005"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_OWNER_ID=${TELEGRAM_OWNER_ID}
      - CHRONOS_URL=http://kairos-chronos:3002
      - BOT_INTERNAL_PORT=3005
    depends_on:
      - chronos
    networks:
      - kairos

  scribe:
    build:
      context: ./services/scribe
      dockerfile: Dockerfile
    container_name: kairos-scribe
    restart: unless-stopped
    ports:
      - "${SCRIBE_PORT:-3004}:3004"
    environment:
      - SCRIBE_PORT=3004
      - SCRIBE_DB_PATH=data/scribe.db
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - SLACK_USER_TOKEN=${SLACK_USER_TOKEN}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID:-D0A55T5E4J0}
      - FORGE_URL=http://kairos-forge:3001
      - FORGE_API_KEY=${FORGE_API_KEY}
      - BOT_URL=http://kairos-bot:3005
      - TELEGRAM_OWNER_ID=${TELEGRAM_OWNER_ID}
    volumes:
      - scribe-data:/app/data
    depends_on:
      - forge
      - bot
    networks:
      - kairos

networks:
  kairos:
    driver: bridge

volumes:
  forge-data:
  chronos-data:
  scribe-data:
